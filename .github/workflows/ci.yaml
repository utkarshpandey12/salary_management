name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format --check
        run: uv run ruff format --check .
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    name: tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev
      - name: Run migrations
        run: uv run python manage.py migrate --no-input
      - name: Run pytest with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          CELERY_ALWAYS_EAGER: "1"
        run: |
          uv run pytest --cov=apps --cov-report=term-missing --cov-report=xml --cov-report=html -v
          echo "coverage xml at coverage.xml"
      - name: Coverage threshold
        run: uv run coverage report --fail-under=70
      - name: Upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload htmlcov
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
      # Optional: codecov
      # - uses: codecov/codecov-action@v4
      #   with:
      #     files: ./coverage.xml

  report:
    name: report coverage summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Print coverage
        run: |
          echo "Coverage XML downloaded, size: $(wc -c < coverage.xml) bytes"
          cat coverage.xml | head -n 30

# Usage:
# - Pre-commit locally: uv run pre-commit install && uv run pre-commit run --all-files
# - Ruff: uv run ruff check . --fix && uv run ruff format .
# - Tests: uv run pytest --cov=apps --cov-report=term-missing
