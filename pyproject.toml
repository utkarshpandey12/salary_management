[project]
name = "salary-management"
version = "0.1.0"
description = "HR Salary Management — Django + DRF + HTMX for 10k employees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-htmx>=1.18",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.35",
    "django-storages[s3]>=1.14",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "Pillow>=11.0",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "coverage>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
addopts = "-q --cov=apps --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "*/__pycache__/*"]

[tool.coverage.report]
# TDD: skeleton has almost no code; gate starts at 0 and is raised back to 75
# in the final full-suite step once real coverage justifies it.
fail_under = 0
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "staticfiles", "media", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "W"]
ignore = ["E501", "B011", "B904", "E702", "F841", "E741", "F401", "F403", "E722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
