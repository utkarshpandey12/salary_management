{% load humanize %}
<table>
    <tbody>
        {% for e in employees %}
        <tr>
            <td><a href="{% url 'employee-detail' e.employee_id %}">{{ e.employee_id }}</a></td>
            <td>{{ e.full_name }}</td>
            <td>{{ e.job_title }}</td>
            <td>{{ e.country }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
