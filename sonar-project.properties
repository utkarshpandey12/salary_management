# SonarQube / static analysis config (used in TDD refactor phase)
sonar.projectKey=acme-salary-management
sonar.projectName=ACME Salary Management
sonar.projectVersion=0.1.0
sonar.sources=apps,config
sonar.tests=apps
sonar.test.inclusions=**/tests/test_*.py,**/test_*.py
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/staticfiles/**,media/**,htmlcov/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.ruff.reportPaths=ruff-report.json
# Quality gates mirror CI: ruff clean, mypy clean (var-annotated disabled for Django), coverage >=70%
# Local: uv run ruff check . && uv run ruff format --check . && uv run mypy apps --ignore-missing-imports
